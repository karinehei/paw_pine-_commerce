name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Demo mode on purpose. Do not attach SHOPIFY_* secrets to this workflow;
# Playwright and unit tests must pass without a connected store.
env:
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
  CI: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
